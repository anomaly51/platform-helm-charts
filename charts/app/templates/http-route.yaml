{{- if .Values.httpRoute.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "httpRoute requires service.enabled=true" }}
{{- end }}
{{- $host := required "httpRoute.host is required when httpRoute.enabled=true" .Values.httpRoute.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: {{ .Values.httpRoute.pathType }}
            value: {{ .Values.httpRoute.path | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "app.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
