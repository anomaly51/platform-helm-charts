---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: {{ include "app.namespace" . }}
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"harbor.api-api-api.com":{"username":"{{ "{{ .username }}" }}","password":"{{ "{{ .password }}" }}","auth":"{{ "{{ printf \"%s:%s\" .username .password | b64enc }}" }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: shared/harbor
        property: username
    - secretKey: password
      remoteRef:
        key: shared/harbor
        property: password
{{- range .Values.externalSecrets }}
{{- $secretStoreRef := default dict .secretStoreRef }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ default (include "app.namespace" $) .namespace }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ default "5m" .refreshInterval | quote }}
  secretStoreRef:
    name: {{ default "vault-backend" $secretStoreRef.name }}
    kind: {{ default "ClusterSecretStore" $secretStoreRef.kind }}
  target:
    name: {{ default .name .targetName }}
    creationPolicy: {{ default "Owner" .creationPolicy }}
    {{- with .deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- with .template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
