name: ""
# nameOverride is retained for wrappers built with app <= 0.4.3.
nameOverride: ""
resourceName: ""
# fullnameOverride is retained for wrappers built with app <= 0.4.3.
fullnameOverride: ""
labels: {}
# Disable generated metadata labels when adopting resources with existing labels.
includeStandardLabels: true

cluster:
  certManager:
    issuer: letsencrypt-production
  externalDns:
    target: ""

namespace:
  # Argo CD creates the destination namespace. Enable only when the chart must own it.
  create: false
  name: ""
  labels: {}
  annotations: {}

replicaCount: 1
deploymentAnnotations: {}
strategy: {}
revisionHistoryLimit: null
progressDeadlineSeconds: null
# Preview workloads roll with no surge and are created in Argo CD sync wave 3.
ephemeral: false

selectorLabels: {}

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Named images used by object placeholders, for example __IMAGE_api__.
images: {}

imagePullSecrets: []

# Enable only for images hosted in the private Harbor registry.
registryPullSecret:
  enabled: false
  name: harbor-pull-secret
  registry: harbor.internal.api-api-api.com
  refreshInterval: 1h
  deletionPolicy: ""
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: shared/harbor
    usernameProperty: username
    passwordProperty: password

podAnnotations: {}
podLabels: {}
terminationGracePeriodSeconds: null
nodeSelector: {}
affinity: {}
tolerations: []
podSecurityContext: {}
securityContext: {}
serviceAccountName: ""
# null leaves Kubernetes' default unchanged; false is rendered explicitly.
automountServiceAccountToken: null

command: []
args: []
containerName: ""
lifecycle: {}

env: {}
envList: []
envFrom: []

ports:
  - name: http
    containerPort: 80

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: http
  # Omit protocol to retain the existing Service manifest shape.
  protocol: ""
  annotations: {}

ingress:
  enabled: false
  className: traefik
  host: ""
  path: /
  pathType: Prefix
  paths: []
  tlsSecretName: ""
  tls:
    secretName: ""
  annotations: {}

httpRoute:
  enabled: false
  host: ""
  path: /
  pathType: PathPrefix
  gateway:
    name: public
    namespace: networking
    sectionName: https

resources: {}
readinessProbe: {}
livenessProbe: {}
startupProbe: {}

# Independent Deployments/Services keyed by workload name. See README for inheritance.
additionalWorkloads: {}

persistence:
  enabled: false
  name: data
  mountPath: /data
  size: 1Gi
  storageClassName: nfs-client
  accessModes:
    - ReadWriteOnce
  annotations: {}

configMaps: []
externalSecrets: []
# Optional Vault Secrets Operator resources: [{name: ..., spec: {...}}].
vaultStaticSecrets: []
extraVolumes: []
extraVolumeMounts: []
extraContainers: []
initContainers: []

addons:
  minio:
    enabled: false
    name: minio
    image:
      repository: minio/minio
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      ports:
        api: 9000
        console: 9001
    selectorLabels: {}
    auth:
      rootUser: minioadmin
      rootPassword: minioadmin
    persistence:
      enabled: true
      name: data
      mountPath: /data
      size: 10Gi
      storageClassName: nfs-client
      accessModes:
        - ReadWriteOnce
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
        helm.sh/resource-policy: keep
  postgres:
    enabled: false
    name: postgres
    image:
      repository: postgres
      tag: 15-alpine
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 5432
    selectorLabels: {}
    database: app_db
    user: postgres
    passwordSecret:
      name: postgres-secret
      key: password
    persistence:
      enabled: true
      name: data
      mountPath: /var/lib/postgresql/data
      size: 5Gi
      storageClassName: nfs-client
      accessModes:
        - ReadWriteOnce
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
        helm.sh/resource-policy: keep

objects: []
